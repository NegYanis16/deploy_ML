name: CI/CD FastAPI to Hugging Face Spaces

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip" # Crucial pour la vitesse d'execution

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Linting with Ruff
        run: ruff check .

      - name: Run Pytest
        run: pytest --cov=app tests/

  deploy:
    name: Deploy to Production
    needs: test
    # Deploiement uniquement sur un push/merge vers main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          SPACE_NAME: "futurisys-ml-api" # A adapter avec le nom de ton Space
        run: |
          git lfs install
          git lfs track "*.joblib"
          git add .gitattributes
          git config --global user.email "ci-cd@futurisys.com"
          git config --global user.name "GitHub Actions CI"
          git add -A
          git diff --cached --quiet || git commit -m "Track binary files with LFS"
          git lfs migrate import --include="*.joblib" --everything
          git remote add huggingface https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME
          git push --force huggingface main