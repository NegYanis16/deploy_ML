[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --verbose
    --cov=app
    --cov-report=term-missing
    --no-cov-on-fail
    --cov-fail-under=70
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::ResourceWarning
markers =
    unit: Unit tests
    functional: Functional/integration tests
    slow: Slow tests
